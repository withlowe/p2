name = "p2"
main = "worker.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "POSTS"
id = "449a486d68134ffc9004c8799b419661"

[[d1_databases]]
binding = "DB"
database_name = "posts"
database_id = "d6a138ba-1a98-44f6-917f-798d6f3a67fa"

[triggers]
crons = ["0 * * * *"]

# Optional: bind an R2 bucket for attachments. Without it, encrypted
# attachments fall back to D1 and are capped at 256 KB of ciphertext.
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "posts-media"
